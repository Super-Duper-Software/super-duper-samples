# electron-builder — packaging config for ticket 19.
#
# macOS: when a Developer ID cert is present in the environment (CSC_LINK, set by
# the CI "Import signing certificate" step) electron-builder signs with the
# hardened runtime and notarizes via the App Store Connect API key (APPLE_API_KEY
# / APPLE_API_KEY_ID / APPLE_API_ISSUER). With no cert — local builds — the
# afterPack hook falls back to an ad-hoc signature so the bundle launches on
# Apple Silicon.
#
# Windows: still UNSIGNED for distribution. No Authenticode cert, first launch
# shows the SmartScreen prompt (see INSTALL.md).
#
# electron-vite writes the app bundles to out/ (main, preload, renderer). This
# file packages that plus the production node_modules electron-builder resolves
# on its own (native better-sqlite3, ffmpeg-static — both asar-unpacked below).

appId: net.superdupersoftware.samples
productName: Super Duper Samples
copyright: © Super Duper Software

directories:
  output: dist
  buildResources: resources

# What goes inside the app. node_modules production deps are always included by
# electron-builder regardless of this list; we only need the built output.
files:
  - out/**
  - package.json

# The bundled fallback drag icon (ticket 09). main/index.ts resolves it from
# process.resourcesPath in a packaged build.
extraResources:
  - from: resources/drag-icon.png
    to: drag-icon.png

# Native / binary payloads must live outside the asar so they are executable and
# loadable at runtime.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/ffmpeg-static/**'

# electron-builder rebuilds native modules (better-sqlite3) against the target
# Electron ABI. CI runs this per-OS on native runners so there is no cross-compile.
npmRebuild: true

# No release channel — the GitHub Release is assembled by the workflow, not by
# electron-builder, and there is no updater to feed.
publish: null

mac:
  category: public.app-category.music
  icon: resources/icon.icns
  darkModeSupport: true
  # Sign only when a Developer ID cert was imported (CI sets CSC_LINK). Without
  # it electron-builder skips signing and the afterPack hook ad-hoc signs.
  # Notarization runs automatically when APPLE_API_KEY / APPLE_API_KEY_ID /
  # APPLE_API_ISSUER are set in the environment and the app was signed.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64

dmg:
  # Plain default window (app icon + Applications alias) — no background art to maintain.
  artifactName: SDS-${version}-${arch}.dmg

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: SDS-Setup-${version}.exe

afterPack: ./scripts/electron-builder-after-pack.mjs
