name: build-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pack-dir:
    # disable for now before public to save on private build minutes
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @superduper/desktop test
      - run: pnpm --filter @superduper/desktop typecheck
      - run: pnpm --filter @superduper/desktop pack:dir
