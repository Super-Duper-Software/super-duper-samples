name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # builds both the arm64 and x64 DMGs (electron-builder.yml)
            script: pack:mac
          - os: windows-latest # x64 NSIS installer
            script: pack:win
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to a commit SHA (comment = the tag it was)
      # so a moved/compromised tag cannot inject code into a run that has secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 — pnpm version comes from the root package.json "packageManager"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write apps/desktop/.env
        shell: bash
        run: |
          {
            echo "FREESOUND_CLIENT_ID=${{ vars.FREESOUND_CLIENT_ID }}"
            echo "FREESOUND_TOKEN_WORKER_URL=${{ vars.FREESOUND_TOKEN_WORKER_URL }}"
          } > apps/desktop/.env

      # macOS signing: imports the Developer ID Application cert into a temporary
      # keychain and exports CSC_LINK / CSC_KEYCHAIN for electron-builder.
      - name: Import signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # Notarization credentials: decode the App Store Connect API key and point
      # electron-builder at it. Auto-notarize triggers when these three are set.
      # Secrets are passed via env (not ${{ }} interpolation into the script) so
      # they never land in the rendered command line.
      - name: Write notarization API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @superduper/desktop ${{ matrix.script }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
          body: |
            The macOS DMGs are signed with a Developer ID and notarized by Apple.
            The Windows installer is still unsigned and will show a SmartScreen
            prompt on first launch - see [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md).

            Verify your download against `SHA256SUMS.txt`.
          files: artifacts/*
