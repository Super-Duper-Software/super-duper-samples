name: build-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pack-dir:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions pinned to a commit SHA (comment = the tag it was).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 — pnpm version comes from the root package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @superduper/desktop test
      - run: pnpm --filter @superduper/desktop typecheck
      - run: pnpm --filter @superduper/desktop pack:dir
